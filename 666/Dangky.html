<head>

        <tr>
            <th>
                <h1>ĐĂNG KÝ THÀNH VIÊN</h1>

        </tr>
        <tr>
            <td>

                    <p>
                        Họ và tên:
                        <input type="text" size="20">
                    </p>
    
                    <p>
                        Ngày sinh:
                        <input type="number" min="1" max="31">

                    <input type="number" min="1" max="12">

                    <input type="text" size="4">
                    </p>
    
    
    
                    <p>
                        Giới tính:
                        <input type="radio" name="gioitinh"> Nam
                        <input type="radio" name="gioitinh"> Nữ
                    </p>
    
                    <p >
                        Địa chỉ: <textarea></textarea>
                    </p>
    
                    <p>
                        Điện thoại:
                        <input type="text" size="15">
                    </p>
                    <p>
                        Email:
                        <input type="email" size="15">
                    </p>
                </fieldset>
            </td>
        </tr>
        <tr>
            <td>
    <fieldset>
        <legend><b>Thông tin đăng nhập</b></legend>
        <p>
            Tên đăng nhập:
            <input type="text"  required size="15">
        </p>
        <p>
            Mật khẩu:
            <input type="password" required size="15">
        </p>
        <p>
            Nhập lại mật khẩu:
            <input type="password" required size="15">
        </p>
        </fieldset>
            </td>
        </tr>
    
        <tr>
            <td align="center">
                <input type="submit" value="Đăng ký">

        </tr>
